name: CI

# Validation only — this workflow NEVER deploys, pushes an image, or touches Demo/Production.
# It runs the backend test suite and the frontend type-check + production build on pull requests
# and on pushes to feature branches. Deployment stays a manual, operator-driven step (see
# DEPLOY_AWS.md / DEPLOY_DEMO_AWS.md); nothing here triggers it.

on:
  pull_request:
  push:
    branches:
      - 'claude/**'
      - 'feature/**'
      - 'ci/**'
      - 'security/**'

# Least privilege: the workflow only needs to read the checked-out code.
permissions:
  contents: read

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      # Keep the app out of any "protected" code path and make it explicit that nothing here
      # talks to a real environment. The suite uses in-memory SQLite, so DATABASE_URL is unused;
      # the dummy SECRET_KEY is test-only and is NOT a real secret.
      ENVIRONMENT: development
      SECRET_KEY: ci-test-only-not-a-real-secret-key-0123456789
    steps:
      # Pinned to reviewed major-version tags. Hardening follow-up: pin to full commit SHAs.
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install dependencies (pinned)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run backend test suite
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (reproducible, from lockfile)
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Production build
        working-directory: frontend
        run: npm run build
